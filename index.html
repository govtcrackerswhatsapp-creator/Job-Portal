<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Information Portal</title>

    <!--
      Fonts moved here from index.css.

      A CSS @import meant the browser had to download and parse index.css before
      it even discovered the Google Fonts URL, then fetch that stylesheet, then
      the font files themselves — three sequential render-blocking hops, none of
      them visible to the preload scanner. As <link> tags in the HTML head they
      are found during initial parse, so the connections open in parallel with
      the JS bundle instead of queueing behind it.

      crossorigin on the gstatic hint is required: fonts are fetched in CORS
      mode, and a preconnect without it opens a connection that cannot be
      reused for the actual font request.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <!--
      Firestore. Every page begins with a read — landing settings for signed-out
      visitors, jobs and categories once signed in — so the DNS lookup and TLS
      handshake are on the critical path no matter who is visiting. Doing them
      while the JS bundle downloads takes them off it.
    -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <!--
      Where the hero images live.

      Change this to whatever host you actually use. It is the single biggest
      remaining win in the cold-load chain: the hero URL comes from Firestore,
      so the browser cannot discover it until that read returns, and opening the
      connection early means the download starts the moment the URL is known
      rather than after a fresh handshake.

      Leave it as-is if your images are on Firebase Storage. If they are on
      imgbb, Cloudinary or anywhere else, replace the host. A preconnect to a
      host you never contact wastes one connection and nothing more, but it is
      pointless — delete the line rather than leave a wrong one.
    -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />

    <meta name="theme-color" content="#8b2df2" />
    <meta
      name="description"
      content="Latest government, corporate, internship and exam notifications with eligibility, application dates and exam details."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
